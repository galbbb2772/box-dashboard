name: Verify Dashboard Charts and Trade Blotter

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/forward-detail.js"
      - "data/history/**"
      - "data/trades_*.json"
      - ".github/workflows/ui-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify saved 2026 daily observations and public trade schema
        shell: bash
        run: |
          python - <<'PY'
          import base64, datetime, json, struct
          from pathlib import Path
          expected_ids=[f"FWD-{i:02d}" for i in range(1,7)]
          for lane_id in expected_ids:
              src=json.loads((Path("data/history")/(lane_id+".json")).read_text())
              n=int(src["n"]); base=int(src["base"])
              days=base64.b64decode(src["do"]); equity=base64.b64decode(src["eq"])
              assert len(days)==2*n and len(equity)==8*n, lane_id
              date_list=[(datetime.date(1970,1,1)+datetime.timedelta(days=base+struct.unpack_from("<H",days,i*2)[0])).isoformat() for i in range(n)]
              assert date_list==sorted(set(date_list)), lane_id
              april=[s for s in date_list if "2026-04-01"<=s<="2026-10-09"]
              assert len(april)>120, (lane_id,len(april))
              assert date_list[-1]>="2026-10-09", (lane_id,date_list[-1])
              print(lane_id, "daily rows",n,"research period",april[0],april[-1],"research days",len(april))
          research=json.loads(Path("data/trades_research.json").read_text())
          official=json.loads(Path("data/trades_official.json").read_text())
          assert research["count"]==len(research["rows"])>=100
          assert official["count"]==len(official["rows"])
          for t in research["rows"]:
              assert t["universe"] in ("Top300","Top500")
              assert t["symbol"] and t["entry_date"]>="2026-04-01"
              assert t["signal_date"] and "box_scale" in t and "asset_type" in t
          html=Path("index.html").read_text()
          assert 'id="timeline"' in html and 'id="trades"' in html
          assert 'assets/forward-detail.js' in html
          print("Verified saved 4–10 month curves and",len(research["rows"]),"trade records.")
          PY

      - name: Install browser smoke dependency
        run: |
          python -m pip install -q playwright==1.56.0
          python -m playwright install --with-deps chromium >/dev/null

      - name: Browser-verify visible line charts and trade table
        shell: bash
        run: |
          python -m http.server 8787 --bind 127.0.0.1 > /tmp/box-dashboard-server.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={"width": 1440, "height": 960})
              page.goto("http://127.0.0.1:8787/",wait_until="domcontentloaded",timeout=30000)
              page.wait_for_selector("#researchTimelineChart svg",timeout=30000)
              text=page.locator("#timelineMeta").inner_text()
              assert "2026-10-09" in text, text
              assert page.locator("#researchTimelineChart svg path").count()>=6
              page.screenshot(path="/tmp/box-curves.png",full_page=True)
              page.locator('.tabs button[data-tab="trades"]').click()
              page.wait_for_selector("#researchTradeTable tbody tr",timeout=20000)
              n=page.locator("#researchTradeTable tbody tr").count()
              assert n>=100, n
              assert "Top300" in page.locator("#researchTradeTable").inner_text()
              assert "2026-10-02" in page.locator("#researchTradeTable").inner_text()
              page.screenshot(path="/tmp/box-trades.png",full_page=True)
              print("BROWSER PASS: visible 4–10 month line chart, end date",text,"trade rows",n)
              browser.close()
          PY

      - name: Upload verified preview captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-ui-proof
          path: |
            /tmp/box-curves.png
            /tmp/box-trades.png
          retention-days: 14
          if-no-files-found: warn
